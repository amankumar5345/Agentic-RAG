[project]
name = "rag-lithography"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deep-translator>=1.11.4",
    "deepeval>=4.1.8",
    "flashrank>=0.2.10",
    "gtts>=2.5.4",
    "langchain>=1.3.15",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "litellm>=1.97.0",
    "nemoguardrails>=0.23.0",
    "nest-asyncio>=1.6.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=5.7.0",
    "SpeechRecognition>=3.17.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
